name: odds-tracker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: odds-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run tracker
        run: python tracker.py

      - name: Save data
        run: |
          git config user.name "odds-tracker"
          git config user.email "odds-tracker@users.noreply.github.com"
          git add data/games.csv
          git diff --cached --quiet || (git commit -m "update data" && git push)
